name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify release version
        shell: bash
        run: |
          manifest_version="$(jq -r '.version' custom_components/pfsense/manifest.json)"
          if [[ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest_version}"
            exit 1
          fi
      - name: Release
        uses: softprops/action-gh-release@v3
