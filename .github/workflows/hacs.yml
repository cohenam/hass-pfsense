name: HACS

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: HACS
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          CATEGORY: "integration"
