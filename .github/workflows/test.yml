name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            homeassistant: "2025.12.0"
            pycares: "4.11.0"
          - python: "3.14"
            homeassistant: "2026.7.3"
            pycares: "5.0.1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install \
            "homeassistant==${{ matrix.homeassistant }}" \
            "mac-vendor-lookup==0.1.15" \
            "pytest==9.0.0" \
            "pytest-asyncio==1.3.0" \
            "pycares==${{ matrix.pycares }}"
      - name: Run tests
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install lint dependencies
        run: python -m pip install -r requirements_dev.txt
      - run: ruff check custom_components tests
      - run: black --check custom_components tests
      - run: isort --check-only custom_components tests
