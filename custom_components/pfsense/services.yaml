close_notice:
  name: Close notice
  description: Closes one or more notices.
  target:
    entity:
      integration: pfsense
  fields:
    id:
      name: Notice ID
      description: The notice ID, or "all" to close every notice.
      required: false
      example: "all"
      default: "all"

file_notice:
  name: File notice
  description: Files a notice.
  target:
    entity:
      integration: pfsense
  fields:
    id:
      name: Notice ID
      description: The notice ID.
      required: true
      example: "home_assistant"
    notice:
      name: Notice message
      description: The notice message.
      required: true
      example: "Hello from Home Assistant"
    category:
      name: Notice category
      description: The notice category.
      required: false
      advanced: true
      example: "General"
      default: "HASS"
    url:
      name: Notice URL
      description: The URL associated with the notice.
      required: false
      advanced: true
      example: "https://example.com"
      default: ""
    priority:
      name: Notice priority
      description: The notice priority.
      required: false
      advanced: true
      example: 1
      default: 1
    local_only:
      name: Only show in the UI
      description: Do not send the notice through external notification channels.
      required: false
      advanced: true
      example: false
      default: false

start_service:
  name: Start service
  description: Starts a pfSense service.
  target:
    entity:
      integration: pfsense
  fields:
    service_name:
      name: Service name
      description: The pfSense service name.
      required: true
      example: "haproxy"
    service:
      name: Service data
      description: JSON-encoded service data.
      required: false
      advanced: true
      example: '{"vpnid": 1, "mode": "server"}'
      default: ""

stop_service:
  name: Stop service
  description: Stops a pfSense service.
  target:
    entity:
      integration: pfsense
  fields:
    service_name:
      name: Service name
      description: The pfSense service name.
      required: true
      example: "haproxy"
    service:
      name: Service data
      description: JSON-encoded service data.
      required: false
      advanced: true
      example: '{"vpnid": 1, "mode": "server"}'
      default: ""

restart_service:
  name: Restart service
  description: Restarts a pfSense service.
  target:
    entity:
      integration: pfsense
  fields:
    service_name:
      name: Service name
      description: The pfSense service name.
      required: true
      example: "haproxy"
    only_if_running:
      name: Only if running
      description: Only restart the service when it is currently running.
      required: false
      advanced: true
      example: false
      default: false
    service:
      name: Service data
      description: JSON-encoded service data.
      required: false
      advanced: true
      example: '{"vpnid": 1, "mode": "server"}'
      default: ""

reset_state_table:
  name: Reset state table
  description: Forces all existing connections to close and reestablish.
  target:
    entity:
      integration: pfsense

kill_states:
  name: Kill states
  description: Removes state table entries for a source or source/destination pair.
  target:
    entity:
      integration: pfsense
  fields:
    source:
      name: Source
      description: An IPv4 or IPv6 host or network.
      required: true
      example: "0.0.0.0/0"
    destination:
      name: Destination
      description: An optional IPv4 or IPv6 host or network.
      required: false
      example: "192.168.0.1/24"

system_halt:
  name: Halt system
  description: Halts the pfSense system.
  target:
    entity:
      integration: pfsense

system_reboot:
  name: Reboot system
  description: Reboots the pfSense system.
  target:
    entity:
      integration: pfsense

send_wol:
  name: Send WOL
  description: Sends a wake-on-LAN magic packet.
  target:
    entity:
      integration: pfsense
  fields:
    interface:
      name: Interface name
      description: The pfSense interface name.
      required: true
      example: "lan"
    mac:
      name: MAC address
      description: The target MAC address.
      required: true
      example: "00:11:22:33:44:55"

set_default_gateway:
  name: Set default gateway
  description: Sets the default IPv4 or IPv6 gateway.
  target:
    entity:
      integration: pfsense
  fields:
    gateway:
      name: Gateway name
      description: The gateway name. Use "-" for none or an empty value for automatic.
      required: true
      example: "GW_WAN"
    ip_version:
      name: IP version
      description: The IP version to update.
      required: true
      example: "4"
      default: "4"

exec_php:
  name: Execute PHP script
  description: >-
    Executes arbitrary PHP as root. Requires an administrator and the
    allow_unsafe_services config-entry option.
  target:
    entity:
      integration: pfsense
  fields:
    script:
      name: PHP script
      description: The PHP source to execute.
      required: true
      example: '$toreturn = ["data" => true];'

exec_command:
  name: Execute command
  description: >-
    Executes an arbitrary command as root. Requires an administrator and the
    allow_unsafe_services config-entry option.
  target:
    entity:
      integration: pfsense
  fields:
    command:
      name: Command
      description: The shell command to execute.
      required: true
      example: "ping -c 1 example.com"
    background:
      name: Run in background
      description: Starts the command without waiting for it to finish.
      required: false
      advanced: true
      example: false
      default: false
